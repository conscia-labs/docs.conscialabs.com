name: Validate documentation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 12.3.4
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d7f31b0c80e70d5b6d1c26c4410 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript and content
        run: pnpm check
      - name: Build static site
        run: pnpm build
      - name: Check generated internal links
        run: pnpm check:links
